[package]
name = "gcs_rts"
version = "0.2.0"
edition = "2021"
description = "Ground Control Station for OCS-GCS communication"
authors = ["GCS Team"]
license = "MIT"

[dependencies]
# 비동기 런타임
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "signal"] }

# AMQP 클라이언트
lapin = "2.5"

# 유틸리티
futures-util = "0.3"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

# 직렬화
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# 로깅
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
tracing-appender = "0.2"

# 바이트 처리
bytes = "1.6"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "perf_bench"
harness = false
